name: Backend Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Run backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        # shortcut: allow low dev advisories until deepmerge fixes GHSA-gcqx-w48m-w2h4, then restore strict auditing.
        run: |
          npm audit --omit=dev
          npm audit --audit-level=moderate

      - name: Run tests
        run: npm test -- --ci

      - name: Build
        run: npm run build
